
name: Python CI/CD Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest

  deploy:
    name: Deploy to EC2 using AWS SSM
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::805269528982:role/GitHubActions-PythonPipeline-DeployRole
          aws-region: us-east-1

      - name: Deploy to EC2 through SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-02d59f34685540d9b"

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -euo pipefail

          echo "Starting deployment..."

          sudo -u ubuntu -H bash -lc '
            set -euo pipefail
            cd /home/ubuntu/project
            git pull --ff-only origin master
            /home/ubuntu/project/venv/bin/pip install -r /home/ubuntu/project/requirements.txt
          '

          echo "Restarting Flask service..."
          systemctl restart gct9
          systemctl is-active --quiet gct9

          echo "Checking application HTTP response..."
          curl -fsS http://127.0.0.1:8000/ >/dev/null

          echo "Deployment successful."
          SCRIPT
          )

          PARAMETERS=$(jq -n --arg cmd "$DEPLOY_SCRIPT" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy python-pipeline from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
