name: Python CI/CD Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: pytest

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::805269528982:role/GitHubActions-PythonPipeline-DeployRole
          aws-region: us-east-1

      - name: Run Deploy via AWS SSM
        run: |
          set -euo pipefail
          INSTANCE_ID="i-02d59f34685540d9b"

          # Send SSM command
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy python-pipeline" \
            --parameters 'commands=["
              set -e
              sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/project && git pull --ff-only origin master && /home/ubuntu/project/venv/bin/pip install -r requirements.txt\"
              sudo systemctl restart gct9
              sudo systemctl is-active --quiet gct9
              curl -fsS http://127.0.0.1:8000/ >/dev/null
              echo \"Deployment successful.\"
            "]' \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll for completion (up to 5 minutes)
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
              exit 0
            elif [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}" --output json
              exit 1
            fi
            sleep 5
          done

          echo "Deployment timed out."
          exit 1
